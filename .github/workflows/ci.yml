name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulation
        run: node test/sim-pipeline.mjs
      - name: Script tests
        run: |
          if ls test/*.test.mjs >/dev/null 2>&1; then
            node --test test/*.test.mjs
          fi
      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          for f in routine/*.sh routine/bin/gh; do
            bash -n "$f" || exit 1
          done
      - name: Manifest version
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bash scripts/check-version.sh
